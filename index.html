<!DOCTYPE html>

<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SWARAJ KRISHNA | Filmmaker &amp; VFX Artist</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Inter:wght@300;400;600&amp;family=Manrope:wght@400;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  primary: "#8B5CF6", // Vibrant violet accent
                  "primary-container": "#6D28D9",
                },
                fontFamily: {
                  "headline": ["Manrope", "sans-serif"],
                  "body": ["Inter", "sans-serif"],
                  "label": ["Inter", "sans-serif"],
                  "antonio": ["Antonio", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
              },
            },
          }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  </head>
  <body id="home" class="bg-[#FBF9F8] text-[#1B1C1C] font-body selection:bg-primary selection:text-white">

  <div id="nav"></div>

  <div id="hero"></div>

  <div id="services"></div>

  <div id="work"></div>

  <div id="about"></div>

  <div id="faq"></div>

  <div id="footer"></div>
  <script>
  const loadComponent = async (id, file) => {
    try {
      const res = await fetch(file);
      if (!res.ok) throw new Error(res.status);
      const html = await res.text();
      const container = document.getElementById(id);
      container.innerHTML = html;
      
      // Execute any script tags injected via components
      const scripts = container.querySelectorAll("script");
      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    } catch (err) {
      console.error(`Error loading ${file}:`, err);
    }
  };

  loadComponent("nav", "./components/nav.html");
  loadComponent("hero", "./components/hero.html");
  loadComponent("services", "./components/services.html");
  loadComponent("work", "./components/work.html");
  loadComponent("about", "./components/about.html");
  loadComponent("faq", "./components/faq.html");
  loadComponent("footer", "./components/footer.html");
</script>
  </body>
  
  </body>
</html>
