<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CONTACT ME | Swaraj Krishna</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&amp;family=Inter:wght@300;400;600&amp;family=Manrope:wght@400;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  primary: "#8B5CF6",
                  "primary-container": "#6D28D9",
                },
                fontFamily: {
                  "headline": ["Manrope", "sans-serif"],
                  "body": ["Inter", "sans-serif"],
                  "label": ["Inter", "sans-serif"],
                  "antonio": ["Antonio", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
              },
            },
          }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  </head>
  <body class="bg-[#FBF9F8] text-[#1B1C1C] font-body selection:bg-primary selection:text-white pt-24">

  <div id="nav"></div>

  <!-- Breadcrumb Banner -->
  <section class="py-20 bg-[#F6F3F2] text-center border-b border-black/5">
    <div class="max-w-screen-2xl mx-auto px-8">
      <h1 class="font-antonio text-5xl md:text-7xl uppercase font-bold tracking-tight text-black mb-4">Contact Me</h1>
      <div class="text-sm uppercase tracking-widest text-primary font-bold">
        <a href="./index.html" class="hover:text-black transition-colors">Home</a>
        <span class="mx-3 text-black/35">/</span>
        <span class="text-black/60">Let's Connect</span>
      </div>
    </div>
  </section>

  <!-- Widgets Section -->
  <section class="py-16 px-6 md:px-12 max-w-screen-2xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Card 1: Address -->
      <div class="bg-white border border-black/5 rounded-sm p-8 flex items-center gap-6 hover:border-primary/30 shadow-sm transition-all duration-300">
        <div class="w-14 h-14 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
          <span class="material-symbols-outlined text-2xl">location_on</span>
        </div>
        <div>
          <h4 class="font-antonio text-lg uppercase text-black/40 mb-1">Address</h4>
          <p class="font-antonio text-xl uppercase text-black font-bold">Kochi, Kerala, India</p>
        </div>
      </div>

      <!-- Card 2: Hotline -->
      <div class="bg-white border border-black/5 rounded-sm p-8 flex items-center gap-6 hover:border-primary/30 shadow-sm transition-all duration-300">
        <div class="w-14 h-14 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
          <span class="material-symbols-outlined text-2xl">call</span>
        </div>
        <div>
          <h4 class="font-antonio text-lg uppercase text-black/40 mb-1">Hotline</h4>
          <a href="tel:+919061460087" class="font-antonio text-xl uppercase text-black hover:text-primary font-bold transition-colors">+91 90614 60087</a>
        </div>
      </div>

      <!-- Card 3: Email -->
      <div class="bg-white border border-black/5 rounded-sm p-8 flex items-center gap-6 hover:border-primary/30 shadow-sm transition-all duration-300">
        <div class="w-14 h-14 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
          <span class="material-symbols-outlined text-2xl">mail</span>
        </div>
        <div>
          <h4 class="font-antonio text-lg uppercase text-black/40 mb-1">Email</h4>
          <a href="mailto:swarajkrishna90@gmail.com" class="font-antonio text-xl uppercase text-black hover:text-primary font-bold transition-colors">swarajkrishna90@gmail.com</a>
        </div>
      </div>

    </div>
  </section>

  <!-- Interactive Map & Form Section -->
  <section class="py-20 px-6 md:px-12 max-w-screen-2xl mx-auto">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
      
      <!-- Google Map Frame -->
      <div class="bg-white border border-black/5 p-2 rounded-sm h-[450px] overflow-hidden shadow-md">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d251479.23612511015!2d76.1373064401548!3d9.98683822376732!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3b080d514abec6bf%3A0xbd582caa5844192!2sKochi%2C%20Kerala!5e0!3m2!1sen!2sin!4v1753423744273!5m2!1sen!2sin"
          class="w-full h-full rounded-sm grayscale opacity-85 hover:grayscale-0 hover:opacity-100 transition-all duration-500"
          style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <!-- Contact Form -->
      <div class="bg-white border border-black/5 p-10 rounded-sm shadow-md">
        <h3 class="font-antonio text-3xl uppercase mb-8 text-black font-bold">Get in touch</h3>
        
        <form id="contact-form" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
              <label for="name" class="block text-xs uppercase tracking-widest text-black/55 mb-2 font-bold font-body">Your Name</label>
              <input type="text" id="name" required class="bg-white border border-black/15 rounded-sm px-4 py-3 text-black placeholder-black/30 w-full focus:outline-none focus:border-primary transition-colors font-body">
            </div>
            <div>
              <label for="email" class="block text-xs uppercase tracking-widest text-black/55 mb-2 font-bold font-body">Email Address</label>
              <input type="email" id="email" required class="bg-white border border-black/15 rounded-sm px-4 py-3 text-black placeholder-black/30 w-full focus:outline-none focus:border-primary transition-colors font-body">
            </div>
          </div>
          
          <div>
            <label for="website" class="block text-xs uppercase tracking-widest text-black/55 mb-2 font-bold font-body">Your Website (Optional)</label>
            <input type="text" id="website" class="bg-white border border-black/15 rounded-sm px-4 py-3 text-black placeholder-black/30 w-full focus:outline-none focus:border-primary transition-colors font-body">
          </div>
          
          <div>
            <label for="message" class="block text-xs uppercase tracking-widest text-black/55 mb-2 font-bold font-body">Project details / Message</label>
            <textarea id="message" rows="5" required class="bg-white border border-black/15 rounded-sm px-4 py-3 text-black placeholder-black/30 w-full focus:outline-none focus:border-primary transition-colors font-body"></textarea>
          </div>
          
          <button type="submit" class="w-full bg-black hover:bg-black/85 text-white py-4 rounded-sm font-label uppercase tracking-widest text-sm active:scale-98 transition-all duration-300 flex items-center justify-center gap-2">
            Send Message
            <span class="material-symbols-outlined text-sm text-white">send</span>
          </button>
        </form>
      </div>

    </div>
  </section>

  <div id="footer"></div>

  <!-- Form Handler Script -->
  <script>
    document.getElementById("contact-form")?.addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const website = document.getElementById("website").value;
      const message = document.getElementById("message").value;

      const subject = encodeURIComponent("New Project Query from Portfolio");
      const body = encodeURIComponent(
        `Name: ${name}\nEmail: ${email}\nWebsite: ${website || 'N/A'}\n\nMessage:\n${message}`
      );

      window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=swarajkrishna90@gmail.com&su=${subject}&body=${body}`, "_blank");
    });
  </script>

  <!-- Loader Script -->
  <script>
    const loadComponent = async (id, file) => {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(res.status);
        const html = await res.text();
        const container = document.getElementById(id);
        container.innerHTML = html;
        
        // Execute scripts
        const scripts = container.querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      } catch (err) {
        console.error(`Error loading ${file}:`, err);
      }
    };

    loadComponent("nav", "./components/nav.html");
    loadComponent("footer", "./components/footer.html");
  </script>
  </body>
</html>
