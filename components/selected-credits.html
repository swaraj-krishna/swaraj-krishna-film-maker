<style>
  #credits-track img {
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

  @keyframes shimmer-slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .animate-shimmer {
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.65) 50%, transparent 100%);

<!-- Credits Lightbox -->
<div id="credits-lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden items-center justify-center p-4">
  <button onclick="closeCreditLightbox()" class="absolute top-6 right-6 text-white hover:text-primary transition-colors focus:outline-none z-50">
    <span class="material-symbols-outlined text-4xl">close</span>
  </button>
  <img id="credits-lightbox-img" src="" alt="Selected Credit" class="max-w-full max-h-[90vh] object-contain rounded-sm shadow-2xl"/>
</div>

<script>
  (function() {
    const track = document.getElementById('credits-track');
    const prevBtn = document.getElementById('credits-prev');
    const nextBtn = document.getElementById('credits-next');

    // Scroll amount: one card width + gap
    function getScrollAmount() {
      const card = track.querySelector('.shrink-0');
      return card ? card.offsetWidth + 16 : 280;
    }

    if (prevBtn && nextBtn && track) {
      prevBtn.addEventListener('click', () => {
        track.scrollBy({ left: -getScrollAmount() * 2, behavior: 'smooth' });
      });
      nextBtn.addEventListener('click', () => {
        track.scrollBy({ left: getScrollAmount() * 2, behavior: 'smooth' });
      });
    }
  })();

  window.openCreditLightbox = function(src) {
    const lb = document.getElementById('credits-lightbox');
    const img = document.getElementById('credits-lightbox-img');
    if (lb && img) {
      img.src = src;
      lb.classList.remove('hidden');
      lb.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
  };

  window.closeCreditLightbox = function() {
    const lb = document.getElementById('credits-lightbox');
    if (lb) {
      lb.classList.add('hidden');
      lb.classList.remove('flex');
      document.body.style.overflow = '';
    }
  };

  document.getElementById('credits-lightbox')?.addEventListener('click', function(e) {
    if (e.target === this) closeCreditLightbox();
  });
</script>
