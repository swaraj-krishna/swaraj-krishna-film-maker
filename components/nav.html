<!-- Mobile Nav Menu Drawer -->
  <div id="mobile-drawer" class="fixed inset-0 bg-white text-[#1B1C1C] z-40 flex flex-col justify-start items-center gap-6 pt-28 pb-12 overflow-y-auto translate-x-full transition-transform duration-500 md:hidden">
    <a class="font-['Antonio'] uppercase tracking-wider text-3xl text-black/60 hover:text-black hover:scale-105 transition-all duration-300" href="./index.html" onclick="toggleMobileMenu()">Home</a>
    <a class="font-['Antonio'] uppercase tracking-wider text-3xl text-black/60 hover:text-black hover:scale-105 transition-all duration-300" href="./about.html" onclick="toggleMobileMenu()">About</a>
    <a class="font-['Antonio'] uppercase tracking-wider text-3xl text-black/60 hover:text-black hover:scale-105 transition-all duration-300" href="./work.html" onclick="toggleMobileMenu()">Work</a>
    <a class="font-['Antonio'] uppercase tracking-wider text-3xl text-black/60 hover:text-black hover:scale-105 transition-all duration-300" href="./skills.html" onclick="toggleMobileMenu()">Skills</a>
    <a class="font-['Antonio'] uppercase tracking-wider text-3xl text-black/60 hover:text-black hover:scale-105 transition-all duration-300" href="./contact.html" onclick="toggleMobileMenu()">Contact</a>
    
    <a href="./contact.html" onclick="toggleMobileMenu()" class="mt-4 bg-black text-white px-8 py-3 rounded-sm font-label uppercase tracking-widest text-sm hover:bg-black/85 transition-colors">
      Let's Talk
    </a>
  </div>

  <script>
    (function() {
      const btn = document.getElementById('mobile-menu-btn');
      const drawer = document.getElementById('mobile-drawer');
      const icon = document.getElementById('menu-icon');

      if (btn && drawer) {
        btn.addEventListener('click', () => {
          const isOpen = !drawer.classList.contains('translate-x-full');
          if (isOpen) {
            drawer.classList.add('translate-x-full');
            icon.textContent = 'menu';
          } else {
            drawer.classList.remove('translate-x-full');
            icon.textContent = 'close';
          }
        });
      }

      window.toggleMobileMenu = function() {
        if (drawer && icon) {
          drawer.classList.add('translate-x-full');
          icon.textContent = 'menu';
        }
      }

      // Highlight active nav link based on current page url
      const path = window.location.pathname;
      const page = path.split("/").pop();
      
      let activeId = '';
      if (page === 'index.html' || page === '') activeId = 'nav-home';
      else if (page === 'about.html') activeId = 'nav-about';
      else if (page === 'work.html') activeId = 'nav-work';
      else if (page === 'skills.html') activeId = 'nav-skills';
      else if (page === 'contact.html') activeId = 'nav-contact';

      if (activeId) {
        const activeEl = document.getElementById(activeId);
        if (activeEl) {
          activeEl.classList.remove('text-black/60');
          activeEl.classList.add('text-primary', 'font-bold', 'border-b-2', 'border-primary', 'pb-0.5');
        }
      }
    })();
  </script>
