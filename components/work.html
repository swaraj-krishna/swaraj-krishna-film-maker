  <!-- Lightbox Modal Container (Hidden by default) -->
  <div id="home-lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <button class="absolute top-6 right-6 text-white hover:text-primary transition-colors focus:outline-none z-50" onclick="closeHomeLightbox()">
      <span class="material-symbols-outlined text-4xl">close</span>
    </button>
    <div class="w-full max-w-4xl max-h-[85vh] flex flex-col items-center justify-center relative">
      <!-- Video Player Container -->
      <div id="home-lightbox-video-container" class="w-full aspect-video hidden">
        <iframe id="home-lightbox-iframe" class="w-full h-full rounded-sm" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <!-- Image Viewer Container -->
      <div id="home-lightbox-image-container" class="max-w-full max-h-full hidden flex flex-col items-center">
        <img id="home-lightbox-img" class="max-w-full max-h-[75vh] object-contain rounded-sm shadow-2xl" src="" alt="Lightbox View"/>
        <div id="home-lightbox-caption" class="text-center text-white/80 mt-4 font-antonio tracking-wider text-xl uppercase font-bold"></div>
      </div>
    </div>
  </div>

  <script>
    window.openHomeLightbox = function(type, src, title) {
      const lightbox = document.getElementById('home-lightbox');
      const videoCont = document.getElementById('home-lightbox-video-container');
      const imgCont = document.getElementById('home-lightbox-image-container');
      const iframe = document.getElementById('home-lightbox-iframe');
      const img = document.getElementById('home-lightbox-img');
      const caption = document.getElementById('home-lightbox-caption');
      
      if (!lightbox) return;
      
      videoCont.classList.add('hidden');
      imgCont.classList.add('hidden');
      iframe.src = '';
      img.src = '';
      
      if (type === 'video') {
        let embedUrl = src;
        if (embedUrl.includes('watch?v=')) {
          const id = embedUrl.split('v=').pop().split('&')[0];
          embedUrl = `https://www.youtube.com/embed/${id}`;
        } else if (embedUrl.includes('youtu.be/')) {
          const id = embedUrl.split('youtu.be/').pop().split('?')[0];
          embedUrl = `https://www.youtube.com/embed/${id}`;
        }
        iframe.src = embedUrl + "?autoplay=1";
        videoCont.classList.remove('hidden');
      } else {
        img.src = src;
        caption.textContent = title || '';
        imgCont.classList.remove('hidden');
      }
      
      lightbox.classList.remove('hidden');
      lightbox.classList.add('flex');
      document.body.style.overflow = 'hidden';
    };

    window.closeHomeLightbox = function() {
      const lightbox = document.getElementById('home-lightbox');
      const iframe = document.getElementById('home-lightbox-iframe');
      if (lightbox) {
        lightbox.classList.add('hidden');
        lightbox.classList.remove('flex');
        if (iframe) iframe.src = '';
        document.body.style.overflow = '';
      }
    };

    // Close lightbox on click outside the player
    document.getElementById('home-lightbox')?.addEventListener('click', function(e) {
      if (e.target === this) {
        closeHomeLightbox();
      }
    });
  </script>
