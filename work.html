        src: v.src,
        url: v.url,
        description: v.description,
        filters: v.filter
      });
    });

    // Compile images
    let folderIds = Object.keys(projectFolders);
    folderIds = folderIds.filter(id => id !== 'blender-3d' && id !== 'vfx-studio' && id !== 'achivements');
    folderIds.push('blender-3d', 'vfx-studio', 'achivements');

    folderIds.forEach(folderId => {
      const folder = projectFolders[folderId];
      const category = filtersMap[folderId] || '';
      folder.images.forEach(img => {
        if (!img.toLowerCase().endsWith('.heic') && !img.toLowerCase().endsWith('.heif')) {
          allItems.push({
            type: 'image',
            src: img,
            filters: [category],
            description: folder.title
          });
        }
      });
    });

    // Render Function
    function renderGrid(filterValue) {
      const grid = document.getElementById('gallery-grid');
      const emptyState = document.getElementById('gallery-empty');
      grid.innerHTML = '';
      
      const filtered = allItems.filter(item => {
        if (filterValue === 'all') return true;
        return item.filters.includes(filterValue);
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        grid.classList.add('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
        grid.classList.remove('hidden');
      }

      filtered.forEach((item, index) => {

          const safeDesc = item.description.replace(/'/g, "\\'");

                <div>
                  <span class="text-[9px] uppercase tracking-widest text-primary font-bold block mb-1 font-body">Video / VFX</span>
                  <h3 class="font-antonio text-sm sm:text-base uppercase text-black font-bold truncate max-w-[150px] sm:max-w-[170px]">${item.description}</h3>
                </div>
                <span class="material-symbols-outlined text-black/30 group-hover:text-primary transition-colors">arrow_outward</span>
              </div>
            </div>
          `;
        } else {
          cardHTML = `
            <div class="group cursor-pointer bg-white border border-black/5 rounded-sm overflow-hidden shadow-sm hover:shadow-md hover:border-primary/45 transition-all duration-500 opacity-0 scale-95 transform" style="animation: fadeInUp 0.4s ease forwards ${index * 15}ms" onclick="openLightbox('image', '${item.src}', '${item.description}')">
              <div class="aspect-[4/3] overflow-hidden bg-[#F6F3F2] relative">
                <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 brightness-95 group-hover:brightness-100" src="${item.src}" alt="${item.description}" loading="lazy"/>
                <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
                  <div class="w-12 h-12 rounded-full bg-black/95 text-white flex items-center justify-center shadow-lg transform scale-75 group-hover:scale-100 transition-all duration-300">
                    <span class="material-symbols-outlined text-2xl text-white">visibility</span>
                  </div>
                </div>
              </div>
              <div class="p-4 bg-white border-t border-black/5 flex justify-between items-center">
                <div>
                  <span class="text-[9px] uppercase tracking-widest text-primary font-bold block mb-1 font-body">Photography</span>
                  <h3 class="font-antonio text-sm sm:text-base uppercase text-black font-bold truncate max-w-[150px] sm:max-w-[170px]">${item.description}</h3>
                </div>
                <span class="material-symbols-outlined text-black/30 group-hover:text-primary transition-colors">visibility</span>
              </div>
            </div>
          `;
        }
        grid.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    // Filter Trigger Function
    window.filterGallery = function(filterValue, element) {
      // Toggle nav class
      const items = element.parentNode.querySelectorAll('li');
      items.forEach(li => {
        li.classList.remove('text-black', 'border-black', 'font-bold');
        li.classList.add('text-black/60', 'border-transparent');
      });
      element.classList.remove('text-black/60', 'border-transparent');
      element.classList.add('text-black', 'border-black', 'font-bold');
      
      // Render
      renderGrid(filterValue);
    };

    // Inject YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    let ytPlayer = null;
    let currentVideoSrc = '';

    // Lightbox Control
    window.openLightbox = function(type, src, title) {
      const modal = document.getElementById('lightbox-modal');
      const videoCont = document.getElementById('lightbox-video-container');
      const imgCont = document.getElementById('lightbox-image-container');
      const extLink = document.getElementById('lightbox-external-link');
      const img = document.getElementById('lightbox-img');
      const caption = document.getElementById('lightbox-caption');
      
      if (!modal) return;
      currentVideoSrc = src;
      
      videoCont.classList.add('hidden');
      imgCont.classList.add('hidden');
      if(extLink) extLink.href = '';
      img.src = '';
      
      if (type === 'video') {
        let ytId = '';
        if (src.includes('watch?v=')) {
          ytId = src.split('v=').pop().split('&')[0];
        } else if (src.includes('youtu.be/')) {
          ytId = src.split('youtu.be/').pop().split('?')[0];
        } else if (src.includes('youtube.com/shorts/')) {
          ytId = src.split('youtube.com/shorts/').pop().split('?')[0];
        }

        const loadYT = () => {
          if (!ytPlayer) {
            ytPlayer = new YT.Player('lightbox-yt-player', {
              videoId: ytId,
              playerVars: { 'autoplay': 1, 'enablejsapi': 1 },
              events: {
                'onReady': function(event) {
                  event.target.playVideo();
                },
                'onError': function(event) {
                  // 100, 101, 150 typically mean the video owner disabled embedding
                  if (event.data == 101 || event.data == 150 || event.data == 100) {
                    closeLightbox();
                    window.open(currentVideoSrc, '_blank');
                  }
                }
              }
            });
            // Reapply styling to the iframe generated by YT
            setTimeout(() => {
              const iframe = document.getElementById('lightbox-yt-player');
              if(iframe) iframe.className = "w-full h-full rounded-sm shadow-2xl";
            }, 100);
          } else {
            ytPlayer.loadVideoById(ytId);
          }
        };

        if (typeof YT !== 'undefined' && YT.Player) {
          loadYT();
        } else {
          window.onYouTubeIframeAPIReady = loadYT;
        }

        if(extLink) extLink.href = src;
        videoCont.classList.remove('hidden');
      } else {
        img.src = src;
        caption.textContent = title || '';
        imgCont.classList.remove('hidden');
      }
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = function() {
      const modal = document.getElementById('lightbox-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        
        // Stop YouTube video if playing
        if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
          ytPlayer.stopVideo();
        }
        
        document.body.style.overflow = '';
      }
    };

    document.getElementById('lightbox-modal')?.addEventListener('click', function(e) {
      if (e.target === this) {
        closeLightbox();
      }
    });

    // Check query params for active filter
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const filter = urlParams.get('filter');
      
      if (filter) {
        const filterItem = document.querySelector(`li[data-filter="${filter}"]`);
        if (filterItem) {
          filterGallery(filter, filterItem);
          return;
        }
      }
      renderGrid('all');
    });
  </script>

  <!-- Hero Video Controls JavaScript -->
  <script>
    (function() {
      const video = document.getElementById('hero-video');
      const playBtn = document.getElementById('video-play-btn');
      const playIcon = document.getElementById('video-play-icon');
      const muteBtn = document.getElementById('video-mute-btn');
      const muteIcon = document.getElementById('video-mute-icon');
      const toggleOverlayBtn = document.getElementById('video-toggle-overlay-btn');
      const toggleOverlayIcon = document.getElementById('video-toggle-overlay-icon');
      const textContainer = document.getElementById('hero-text-container');

      if (video) {
        playBtn?.addEventListener('click', () => {
          if (video.paused) {
            video.play();
            playIcon.className = 'fa fa-pause text-sm';
          } else {
            video.pause();
            playIcon.className = 'fa fa-play text-sm';
          }
        });

        muteBtn?.addEventListener('click', () => {
          if (video.muted) {
            video.muted = false;
            muteIcon.className = 'fa fa-volume-up text-sm';
            muteBtn.style.background = 'rgba(255, 255, 255, 0.85)';
            muteBtn.style.color = '#1B1C1C';
          } else {
            video.muted = true;
            muteIcon.className = 'fa fa-volume-off text-sm';
            muteBtn.style.background = '#1B1C1C';
            muteBtn.style.color = 'white';
          }
        });

        toggleOverlayBtn?.addEventListener('click', () => {
          const isClean = textContainer.classList.contains('opacity-0');
          if (isClean) {
            textContainer.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
            video.classList.remove('brightness-100', 'blur-none');
            video.classList.add('brightness-[0.5]', 'blur-[2px]');
            toggleOverlayIcon.className = 'fa fa-eye text-sm';
            toggleOverlayBtn.title = 'Toggle Clean View';
          } else {
            textContainer.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
            video.classList.remove('brightness-[0.5]', 'blur-[2px]');
            video.classList.add('brightness-100', 'blur-none');
            toggleOverlayIcon.className = 'fa fa-eye-slash text-sm';
            toggleOverlayBtn.title = 'Show Text & Controls';
          }
        });
      }
    })();
  </script>

  <!-- Keyframes stylesheet injection for fadeInUp animations -->
  <style>
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>

  <!-- Loader Script -->
  <script>
    const loadComponent = async (id, file) => {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(res.status);
        const html = await res.text();
        const container = document.getElementById(id);
        container.innerHTML = html;
        
        // Execute scripts
        const scripts = container.querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      } catch (err) {
        console.error(`Error loading ${file}:`, err);
      }
    };

    loadComponent("nav", "./components/nav.html");
    loadComponent("footer", "./components/footer.html");
  </script>
